<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wfAstrolabeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="wfCraftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <radialGradient id="wfNebulaCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#00f2fe" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#070b14" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Cosmic Aura -->
  <circle cx="50" cy="50" r="44" fill="url(#wfNebulaCore)" />

  <!-- Outer Radar / Celestial Coordinate Ring -->
  <circle cx="50" cy="50" r="42" stroke="url(#wfAstrolabeGrad)" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.6" />
  <circle cx="50" cy="50" r="34" stroke="#38bdf8" stroke-width="1" opacity="0.4" />

  <!-- Interlocking Celestial Astrolabe Rings -->
  <ellipse cx="50" cy="50" rx="38" ry="14" stroke="url(#wfAstrolabeGrad)" stroke-width="2" transform="rotate(-30 50 50)" />
  <ellipse cx="50" cy="50" rx="38" ry="14" stroke="#818cf8" stroke-width="1.5" transform="rotate(30 50 50)" opacity="0.75" />

  <!-- Quantum Wayfarer Surveyor Craft (Traveling along hyperspace axis) -->
  <path d="M50 14 L62 58 L50 50 L38 58 Z" fill="url(#wfCraftGrad)" stroke="#ffffff" stroke-width="1" transform="rotate(45 50 50)" />
  
  <!-- Craft Thruster Exhaust Glow -->
  <polygon points="50,50 46,64 54,64" fill="#facc15" opacity="0.85" transform="rotate(45 50 50)" />

  <!-- Orbiting Data Beacon Probes -->
  <circle cx="78" cy="34" r="3.5" fill="#00f2fe" />
  <circle cx="22" cy="66" r="2.8" fill="#facc15" />
  <circle cx="32" cy="24" r="2" fill="#ffffff" />
  <circle cx="68" cy="76" r="2.2" fill="#818cf8" />

  <!-- Central Luminous Navigation Core -->
  <circle cx="50" cy="50" r="5.5" fill="#ffffff" />
  <circle cx="50" cy="50" r="8" stroke="#00f2fe" stroke-width="1.2" opacity="0.8" />
</svg>
